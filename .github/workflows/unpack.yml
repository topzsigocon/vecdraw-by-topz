name: VecDraw by Topz - Unpack and Build

on:
  push:
    paths:
      - 'update.zip'
      - '.github/workflows/unpack.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract update ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f update.zip || { echo "update.zip not found"; exit 1; }
          python3 - <<'PY'
          import zipfile
          from pathlib import PurePosixPath
          z = zipfile.ZipFile("update.zip")
          for name in z.namelist():
              path = PurePosixPath(name)
              if path.is_absolute() or ".." in path.parts:
                  raise SystemExit(f"Unsafe ZIP path: {name}")
          z.extractall(".")
          PY

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VecDraw-by-Topz-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
